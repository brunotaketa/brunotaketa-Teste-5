<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clip Studio Web — Estúdio de Ilustração Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1b1b1e;
      color: #e2e2e6;
      overflow: hidden;
      touch-action: none;
    }

    /* Custom Scrollbars inspired by CSP Dark UI */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1e22;
    }
    ::-webkit-scrollbar-thumb {
      background: #3e3e46;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525c;
    }

    /* Range Slider Styling (CSP Flat Studio Style) */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #18181b;
      height: 6px;
      border-radius: 3px;
      border: 1px solid #3a3a40;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 3px;
      background: #4a90e2;
      cursor: pointer;
      border: 1px solid #7ab3f5;
      transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
      background: #5da0ef;
    }

    /* Transparency Checkerboard */
    .checkerboard {
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #dcdce0 25%, transparent 25%),
        linear-gradient(-45deg, #dcdce0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #dcdce0 75%),
        linear-gradient(-45deg, transparent 75%, #dcdce0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .checkerboard-sm {
      background-color: #ffffff;
      background-image:
        linear-gradient(45deg, #cccccc 25%, transparent 25%),
        linear-gradient(-45deg, #cccccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #cccccc 75%),
        linear-gradient(-45deg, transparent 75%, #cccccc 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
    }

    /* Studio Panel borders & active states */
    .csp-panel {
      background-color: #252529;
      border-color: #3a3a40;
    }
    .csp-header {
      background-color: #2d2d32;
      border-bottom: 1px solid #3a3a40;
    }
    .csp-btn {
      transition: all 0.12s ease;
    }
    .csp-btn:hover {
      background-color: #36363c;
    }
    .csp-btn.active {
      background-color: #4a90e2;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* Custom Brush Cursor Ring */
    #brushCursor {
      pointer-events: none;
      position: fixed;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.75);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
    }

    .subtool-item.active {
      background-color: #323a48;
      border-color: #4a90e2;
      color: #ffffff;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-xs">

  <!-- Custom Floating Brush Cursor -->
  <div id="brushCursor"></div>

  <!-- Toast / Notification Banner (Replaces alert()) -->
  <div id="toastContainer" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 items-center"></div>

  <!-- ===================================================================== -->
  <!-- 1. TOP COMMAND BAR (Barra Superior de Comandos - CSP Style)           -->
  <!-- ===================================================================== -->
  <header class="h-11 bg-[#2b2b30] border-b border-[#3a3a40] px-2 flex items-center justify-between gap-2 shrink-0 z-30">
    <!-- Left Brand + File Actions -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
      <!-- App Badge -->
      <div class="flex items-center gap-1.5 pr-2 mr-1 border-r border-[#3a3a40] shrink-0">
        <div class="w-6 h-6 rounded bg-gradient-to-br from-[#4a90e2] to-[#285ea8] flex items-center justify-center shadow">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
          </svg>
        </div>
        <span class="font-bold tracking-tight text-gray-100 hidden sm:inline">CLIP STUDIO <span class="text-[#4a90e2]">WEB</span></span>
      </div>

      <!-- Mobile Sidebar Toggles -->
      <button id="toggleLeftDockBtn" title="Alternar Painel de Ferramentas" class="lg:hidden p-1.5 rounded bg-[#34343a] hover:bg-[#404047] text-gray-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>

      <!-- File Actions -->
      <button id="btnNewCanvas" title="Novo Arquivo (Ctrl+N)" class="csp-btn px-2.5 py-1.5 rounded flex items-center gap-1.5 text-gray-200 shrink-0">
        <svg class="w-4 h-4 text-[#4a90e2]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        <span class="hidden md:inline">Novo</span>
      </button>

      <button id="btnImportImage" title="Importar Imagem para Nova Camada" class="csp-btn px-2.5 py-1.5 rounded flex items-center gap-1.5 text-gray-200 shrink-0">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span class="hidden md:inline">Importar</span>
      </button>
      <input type="file" id="imageFileInput" accept="image/*" class="hidden" />

      <button id="btnExportPNG" title="Exportar Ilustração em PNG" class="csp-btn px-2.5 py-1.5 rounded flex items-center gap-1.5 text-gray-200 shrink-0">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="hidden md:inline">Exportar PNG</span>
      </button>

      <div class="h-5 w-[1px] bg-[#3a3a40] mx-0.5 shrink-0"></div>

      <!-- History: Undo / Redo / Clear -->
      <button id="btnUndo" title="Desfazer (Ctrl+Z)" class="csp-btn p-1.5 rounded text-gray-200 disabled:opacity-35 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button id="btnRedo" title="Refazer (Ctrl+Y)" class="csp-btn p-1.5 rounded text-gray-200 disabled:opacity-35 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <button id="btnClearLayer" title="Limpar Camada Atual (Delete)" class="csp-btn p-1.5 rounded text-rose-400 hover:text-rose-300 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>

      <div class="h-5 w-[1px] bg-[#3a3a40] mx-0.5 shrink-0"></div>

      <!-- Canvas View & Artist Tools (Flip Horizontal & Symmetry Ruler) -->
      <button id="btnFlipHorizontal" title="Espelhar Tela Horizontalmente (Verificar Proporções)" class="csp-btn px-2 py-1.5 rounded flex items-center gap-1 text-gray-200 shrink-0">
        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/></svg>
        <span class="hidden xl:inline">Espelhar</span>
      </button>

      <!-- Symmetry Ruler Selector -->
      <div class="flex items-center bg-[#1e1e22] rounded border border-[#3a3a40] p-0.5 shrink-0" title="Régua de Simetria (Recurso Clip Studio)">
        <button id="symNone" class="sym-btn active px-2 py-1 rounded text-[11px]" data-sym="none" title="Sem Simetria">Livre</button>
        <button id="symVertical" class="sym-btn px-2 py-1 rounded text-[11px] text-gray-300 hover:text-white" data-sym="vertical" title="Régua de Simetria Vertical">Sim. V</button>
        <button id="symHorizontal" class="sym-btn px-2 py-1 rounded text-[11px] text-gray-300 hover:text-white" data-sym="horizontal" title="Régua de Simetria Horizontal">Sim. H</button>
        <button id="symQuad" class="sym-btn px-2 py-1 rounded text-[11px] text-gray-300 hover:text-white" data-sym="quad" title="Simetria Quádrupla">4x</button>
      </div>
    </div>

    <!-- Right Zoom Controls & Layers Toggle -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="hidden sm:flex items-center bg-[#1e1e22] border border-[#3a3a40] rounded px-1.5 py-0.5 gap-1">
        <button id="btnZoomOut" title="Reduzir Zoom (-)" class="p-1 hover:text-white text-gray-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span id="zoomLabel" class="w-11 text-center font-mono text-[11px] text-gray-200 cursor-pointer" title="Clique para resetar zoom">100%</span>
        <button id="btnZoomIn" title="Aumentar Zoom (+)" class="p-1 hover:text-white text-gray-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btnResetView" title="Ajustar Tela (Ctrl+0)" class="p-1 hover:text-[#4a90e2] text-gray-400 border-l border-[#3a3a40] pl-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
      </div>

      <button id="btnHelpShortcuts" title="Atalhos de Teclado" class="csp-btn p-1.5 rounded text-gray-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>

      <button id="toggleRightDockBtn" title="Alternar Painel de Camadas" class="lg:hidden p-1.5 rounded bg-[#34343a] hover:bg-[#404047] text-gray-200 flex items-center gap-1">
        <svg class="w-4 h-4 text-[#4a90e2]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span class="text-[11px] hidden sm:inline">Camadas</span>
      </button>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- MAIN STUDIO WORKSPACE (Left Dock + Central Canvas + Right Layers)     -->
  <!-- ===================================================================== -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- =================================================================== -->
    <!-- 2. LEFT DOCK: Tool Strip + Brush Properties + HSV Color Wheel       -->
    <!-- =================================================================== -->
    <aside id="leftDock" class="fixed lg:static inset-y-11 left-0 z-20 flex bg-[#252529] border-r border-[#3a3a40] transition-transform duration-200 -translate-x-full lg:translate-x-0 shadow-2xl lg:shadow-none">

      <!-- Narrow Tool Icons Strip (CSP Vertical Tool Bar) -->
      <div class="w-11 bg-[#202024] border-r border-[#3a3a40] flex flex-col items-center py-2 gap-1.5 shrink-0 overflow-y-auto">
        <!-- Pencil Category -->
        <button class="tool-btn active w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="pencil" title="Lápis & Esboço (P) - Grafite, Lapiseira, Carvão, Pastel">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>

        <!-- Inking Pen Category -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="pen" title="Canetas de Nanquim (B) - G-Pen, Maru, Caligráfica, Marcador">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
        </button>

        <!-- Painting Brushes Category -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="brush" title="Pincéis Artísticos (W) - Aquarela, Óleo, Guache, Chato, Esfumar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
        </button>

        <!-- Airbrush & FX Category -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="airbrush" title="Aerógrafos & Efeitos (A) - Suave, Spray, Retícula, Brilho Neon">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
        </button>

        <!-- Eraser Category -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="eraser" title="Borracha (E) - Dura e Macia">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L13.4 2.8c.8-.8 2-.8 2.8 0L21 7.6c.8.8.8 2 0 2.8L11.4 20"/><path d="M6 11l7 7"/></svg>
        </button>

        <div class="w-6 h-[1px] bg-[#3a3a40] my-0.5"></div>

        <!-- Flood Fill (Balde de Tinta) -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="fill" title="Balde de Tinta (G) - Preenchimento inteligente">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11z"/><path d="M5 2l5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4z"/></svg>
        </button>

        <!-- Eyedropper (Conta-gotas) -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="eyedropper" title="Conta-gotas (I ou Alt) - Capturar cor da tela">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 22l1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="M15 6l3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4z"/></svg>
        </button>

        <!-- Geometric Shapes -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="shape" title="Formas Geométricas (U) - Linha, Retângulo, Elipse">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/><line x1="3" y1="21" x2="11" y2="13"/></svg>
        </button>

        <!-- Move Layer Tool -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="move" title="Mover Camada (V)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        </button>

        <!-- Pan Hand Tool -->
        <button class="tool-btn w-8 h-8 rounded flex items-center justify-center text-gray-300" data-tool="pan" title="Mover Tela / Mão (H ou Espaço)">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        </button>
      </div>

      <!-- Sub-Tool Properties & Color Wheel Column -->
      <div class="w-64 flex flex-col overflow-y-auto divide-y divide-[#3a3a40]">

        <!-- Sub-Tools Palette (Paleta de Subferramentas estilo CSP) -->
        <div id="subToolsSection" class="p-2.5 flex flex-col gap-1.5 bg-[#222226]">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-[11px] uppercase tracking-wider text-gray-300">Subferramentas</span>
            <span id="subToolCategoryBadge" class="text-[10px] text-gray-400">Lápis & Esboço</span>
          </div>
          <div id="subToolsList" class="flex flex-col gap-1 max-h-44 overflow-y-auto pr-0.5">
            <!-- Sub-tool items with live stroke preview injected by JS -->
          </div>
        </div>

        <!-- Sub-Tool / Propriedades da Ferramenta -->
        <div class="p-2.5 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-[11px] uppercase tracking-wider text-gray-300">Propriedades</span>
            <span id="activeToolName" class="text-[11px] font-medium text-[#4a90e2] truncate max-w-[135px]">Lápis Grafite</span>
          </div>

          <!-- Shape Sub-selector (visible only when shape tool selected) -->
          <div id="shapeOptions" class="hidden bg-[#1e1e22] p-1.5 rounded border border-[#3a3a40] flex flex-col gap-1.5">
            <div class="grid grid-cols-3 gap-1">
              <button class="shape-type-btn active py-1 rounded text-[11px] bg-[#4a90e2] text-white" data-shape="line">Linha</button>
              <button class="shape-type-btn py-1 rounded text-[11px] text-gray-300 hover:bg-[#2d2d32]" data-shape="rect">Retângulo</button>
              <button class="shape-type-btn py-1 rounded text-[11px] text-gray-300 hover:bg-[#2d2d32]" data-shape="ellipse">Elipse</button>
            </div>
            <label class="flex items-cen
